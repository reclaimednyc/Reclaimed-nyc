<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RECLAIMED NYC</title>
<meta name="description" content="Curated luxury furniture, professionally sourced, restored, and delivered throughout the Northeast.">
<link rel="canonical" href="https://reclaimed.nyc/">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#ffffff">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Reclaimed NYC">
<meta property="og:title" content="RECLAIMED NYC">
<meta property="og:description" content="Below-market designer furniture, delivered. Based in Jersey City.">
<meta property="og:image" content="https://reclaimed.nyc/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://reclaimed.nyc/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://yqyrbrsnbppazlwtoqos.supabase.co" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Inter:wght@400;500;600&display=swap">
<script defer id="sbjs" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Layout: centered masthead logo + serif nav over a black rule, 2-col product grid, ruled footer. Matches the original site. */
:root{
  --bg:#ffffff; --fg:#161616; --muted:#6f6f6b; --field:#f4f4f4; --line:#161616; --hair:#dcdcdc; --tile:#eeeeec;
  --serif:"Bodoni Moda","Bodoni 72","Didot",Georgia,serif;
  --sans:"Inter",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --gut:max(16px,env(safe-area-inset-left,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.5;padding-top:env(safe-area-inset-top,0px)}
a{color:inherit;text-decoration:none}
img{max-width:100%}
[hidden]{display:none!important}
button{-webkit-tap-highlight-color:transparent}
.wrap{max-width:1100px;margin:0 auto;padding-left:var(--gut);padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:700px){.wrap{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
header{border-bottom:1.5px solid var(--line);padding-block:18px 4px;text-align:center}
@media(min-width:700px){header{padding-block:28px 10px}}
.logo{display:block;width:min(420px,74%);margin:0 auto}
.logo img{display:block;width:100%;height:auto;aspect-ratio:1000/200;border-radius:2px}
nav{display:flex;justify-content:center;flex-wrap:wrap;column-gap:clamp(12px,3.6vw,32px);margin-top:6px}
nav a{font-family:var(--serif);font-size:clamp(13px,3.75vw,20px);letter-spacing:.03em;text-transform:uppercase;padding:10px 0;white-space:nowrap}
nav a[aria-current="page"]{color:var(--muted)}
@media(hover:hover){nav a:hover{color:var(--muted)}}
@media(max-width:350px){nav{column-gap:9px}nav a{font-size:12.5px;letter-spacing:.02em}}

main{min-height:60vh;padding-block:26px 56px}
@media(min-width:700px){main{padding-block:40px 72px}}
/* Bodoni Moda is an optical-size font: at big sizes it switches to a hairline display cut.
   Pin big headings to a sturdier cut so the thin strokes don't disappear on phones. */
h1,.product h2,.pop h2,.reel .meta h3,.tm{font-variation-settings:"opsz" 11}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(31px,8.4vw,56px);line-height:1.06;text-align:center;text-wrap:balance;margin:0 0 22px}
@media(min-width:700px){h1{margin-bottom:36px}}
.lede{text-align:center;color:var(--muted);margin:-8px auto 28px;max-width:34ch;text-wrap:balance}
@media(min-width:700px){.lede{margin-top:-20px;margin-bottom:36px}}

/* filters */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
@media(min-width:700px){.filters{gap:14px;margin-bottom:36px}}
.select{position:relative;min-width:0}
.select select{appearance:none;-webkit-appearance:none;width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--field);border:1.5px solid var(--hair);border-radius:12px;padding:12px 34px 12px 14px;text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
@media(min-width:700px){.select select{font-size:18px;padding:15px 48px 15px 20px}}
.select::after{content:"";position:absolute;right:15px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
@media(min-width:700px){.select::after{right:22px;width:9px;height:9px}}
.count-line{font-size:13px;color:var(--muted);text-align:center;margin:-10px 0 20px;letter-spacing:.02em}
select:focus-visible,a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

/* grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:30px 14px}
@media(min-width:700px){.grid{gap:44px 24px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr);gap:48px 32px}}
.card{display:flex;flex-direction:column;gap:8px;text-align:center;min-width:0}
.card>a.t{display:flex;flex-direction:column;gap:6px}
.ph{position:relative;aspect-ratio:4/5;width:100%;background:var(--tile);overflow:hidden}
.ph>a{display:block;height:100%}
.strip{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.strip img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center;scroll-snap-stop:always;display:block;background:var(--tile)}
@media(hover:hover){.card .strip img{transition:transform .4s ease}.card:hover .strip img{transform:scale(1.03)}}
.nophoto{height:100%;display:grid;place-items:center;font-family:var(--serif);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.dots{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:5px;padding:4px 6px;border-radius:999px;background:rgba(0,0,0,.32);pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);transition:background .2s}
.dots i.on{background:#fff}
.npics{position:absolute;top:8px;right:8px;font-size:11px;font-weight:600;letter-spacing:.03em;color:#fff;background:rgba(0,0,0,.5);padding:2px 7px;border-radius:999px;pointer-events:none;font-variant-numeric:tabular-nums}
.arw{position:absolute;top:50%;width:34px;height:34px;margin-top:-17px;border-radius:50%;border:0;background:rgba(255,255,255,.92);box-shadow:0 1px 5px rgba(0,0,0,.22);display:none;place-items:center;cursor:pointer;padding:0;color:#161616}
.arw svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2}
.arw.l{left:8px}.arw.r{right:8px}
@media(hover:hover) and (pointer:fine){.ph:hover .arw,.hero:hover .arw{display:grid}}
.card h3{font-family:var(--serif);font-weight:400;font-size:clamp(15px,4.1vw,21px);line-height:1.22;margin:4px 0 0;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.price{font-weight:600;font-size:clamp(14px,3.7vw,16px);font-variant-numeric:tabular-nums}
.soldtag{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}
.tag{font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;line-height:1;padding:5px 8px 4px;border-radius:999px;border:1px solid var(--fg);color:var(--fg);white-space:nowrap}
.tag.c-new{background:var(--fg);color:var(--bg)}
.tag.c-open{border-width:1.5px}
.tag.c-like{}
.tag.c-exc{border-color:var(--muted);color:var(--muted)}
.tag.c-good{border:1px dashed var(--muted);color:var(--muted)}
.tag.c-rest{border-color:var(--field);background:var(--field);font-family:var(--serif);font-style:italic;font-weight:500;text-transform:none;letter-spacing:.02em;font-size:12.5px;padding:4px 9px 3px}
.product .tags{margin:2px 0 10px}
.specs{margin:20px 0 8px;border-top:1px solid var(--hair)}
.specs div{display:grid;grid-template-columns:minmax(100px,34%) 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--hair);font-size:16px}
.specs dt{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.specs dd{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.more{border-bottom:1px solid var(--hair);margin:0 0 14px}
.specs+.more{margin-top:-8px}
.more:not(.specs+.more){border-top:1px solid var(--hair);margin-top:18px}
.more summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:14px 0;cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg)}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:"+";font-size:22px;font-weight:400;line-height:1;color:var(--muted)}
.more[open] summary::after{content:"−"}
.more .desc{margin:0 0 16px}
.chk{display:flex;align-items:center;gap:10px;font-size:17px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--fg)}
.adm fieldset{border:1.5px solid var(--hair);border-radius:12px;padding:14px;margin:0;display:grid;gap:14px}
.adm legend{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 6px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.empty a{text-decoration:underline;text-underline-offset:3px}

/* loading skeleton */
.sk .ph,.sk .bar{background:var(--tile)}
.sk .bar{height:14px;border-radius:4px;margin:6px auto 0;width:70%}
.sk .bar+.bar{width:35%}
@media (prefers-reduced-motion:no-preference){.sk .ph,.sk .bar{animation:pulse 1.3s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.55}}

/* product */
.product{max-width:620px;margin:0 auto}
.ptop{display:flex;justify-content:space-between;align-items:center;margin:-6px 0 12px}
.back,.share{font-family:var(--serif);font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 0;background:none;border:0;cursor:pointer}
.share{display:inline-flex;align-items:center;gap:7px}
.share svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
.hero{position:relative;aspect-ratio:4/5;background:var(--tile);overflow:hidden;margin-inline:calc(-1 * var(--gut))}
@media(min-width:660px){.hero{margin-inline:0;border:1px solid var(--hair)}}
.hero .strip{cursor:zoom-in}
.hero .strip img{object-fit:contain;background:var(--bg)}
.hero .nophoto{background:var(--tile)}
.ctr{position:absolute;left:12px;bottom:12px;font-size:13px;font-weight:600;color:#fff;background:rgba(0,0,0,.55);padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums;pointer-events:none}
.zoom{position:absolute;right:12px;bottom:12px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.25);display:grid;place-items:center;cursor:pointer;padding:0}
.zoom svg{width:20px;height:20px;stroke:#161616;fill:none;stroke-width:2.2}
.hero .arw{width:42px;height:42px;margin-top:-21px}
.thumbs{position:relative;display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding:2px 2px 6px;scrollbar-width:none;scroll-padding-inline:2px}
.thumbs::-webkit-scrollbar{display:none}
.thumbs button{flex:0 0 64px;aspect-ratio:1;padding:0;border:1px solid var(--hair);background:var(--tile);cursor:pointer;opacity:.6;transition:opacity .2s}
.thumbs button[aria-current="true"]{border:2px solid var(--fg);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
@media(min-width:700px){.thumbs button{flex-basis:76px}}
.product h2{font-family:var(--serif);font-weight:500;font-size:clamp(27px,7vw,40px);line-height:1.12;text-align:center;margin:22px 0 8px;text-wrap:balance}
.product .price{font-size:22px;display:block;text-align:center}
.product .soldtag{display:block;text-align:center;font-size:13px}
.desc{font-size:17px;margin:14px 0 18px;white-space:pre-line;overflow-wrap:anywhere}
@media(min-width:700px){.desc{font-size:18px}}
.cta{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:14px;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));margin-top:6px}
.cta .btn{flex:1}
.cta.stuck{border-top:1px solid var(--hair)}
.btn{display:flex;justify-content:center;align-items:center;gap:10px;background:var(--fg);color:var(--bg);font-weight:600;font-size:clamp(17px,4.6vw,21px);border-radius:12px;padding:16px;min-height:56px}
@media(hover:hover){.btn:hover{opacity:.88}}
.btn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round}
.note{text-align:center;color:var(--muted);font-size:15px;margin-top:8px}
.note a{text-decoration:underline;text-underline-offset:3px}
@media(min-width:900px){
  .info .tags{justify-content:flex-start}
  .reelp{text-align:left!important}
  .product{max-width:1060px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);column-gap:52px;align-items:start}
  .ptop{grid-column:1/-1}
  .info{position:sticky;top:28px}
  .info h2{text-align:left;margin-top:4px}
  .info .price,.info .soldtag,.info .desc{text-align:left!important}
  .cta{position:static;padding-top:4px}.cta.stuck{border-top:0}  .info .note{text-align:left}
}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:14px;font-weight:500;padding:10px 18px;border-radius:999px;z-index:60;pointer-events:none}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:#0c0c0c;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:contain}
.lb .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.lb img{max-width:100%;max-height:100%;width:auto;height:auto;transform-origin:center;will-change:transform;-webkit-user-drag:none;pointer-events:none;transition:opacity .15s}
.lb .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:26px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.lb .ct{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#bbb;font-size:14px;pointer-events:none;font-variant-numeric:tabular-nums;transition:opacity .2s}
.lb .lbp{position:absolute;top:50%;margin-top:-24px;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;cursor:pointer;display:none;place-items:center;padding:0}
.lb .lbp svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2}
.lb .lbp.l{left:16px}.lb .lbp.r{right:16px}
@media(hover:hover) and (pointer:fine){.lb.multi .lbp{display:grid}}

/* reels feed */
.feed{position:fixed;inset:0;z-index:40;background:#000;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.reel{position:relative;height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:grid;place-items:center;overflow:hidden}
.reel video{width:100%;height:100%;object-fit:cover;max-width:min(100%,calc(100dvh * 9 / 16));background:#000}
@media(min-aspect-ratio:3/4){.reel video{object-fit:contain}}
.reel .shade{position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.7));pointer-events:none}
.reel .meta{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:min(100%,calc(100dvh * 9 / 16));padding:0 18px calc(22px + env(safe-area-inset-bottom,0px));color:#fff;display:grid;gap:8px;text-align:left}
.reel .meta h3{font-family:var(--serif);font-weight:500;font-size:clamp(24px,6.6vw,32px);line-height:1.1;margin:0;text-wrap:balance;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.reel .meta .tags{justify-content:flex-start}
.reel .meta .tag{border-color:#fff;color:#fff}.reel .meta .tag.c-new{background:#fff;color:#111}.reel .meta .tag.c-rest{background:rgba(255,255,255,.2);border-color:transparent}
.reel .mp{font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.reel .view{display:flex;justify-content:center;align-items:center;background:#fff;color:#111;font-weight:600;font-size:17px;border-radius:12px;min-height:52px;margin-top:6px}
.feedbar{position:fixed;top:0;left:0;right:0;z-index:41;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;pointer-events:none}
.feedbar>*{pointer-events:auto}
.feedbar .fb{width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;font-size:24px;line-height:1}
.feedbar .fb svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2}
.feedbar .ttl{font-family:var(--serif);color:#fff;font-size:17px;letter-spacing:.1em;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.reel .paused{position:absolute;width:74px;height:74px;border-radius:50%;background:rgba(0,0,0,.4);display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .2s}
.reel .paused::after{content:"";border-left:24px solid #fff;border-top:15px solid transparent;border-bottom:15px solid transparent;margin-left:6px}
.reel.is-paused .paused{opacity:1}
.reel .hintup{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:rgba(255,255,255,.85);font-size:13px;pointer-events:none;transition:opacity .4s}
.reelbtn{display:inline-flex;align-items:center;gap:8px;margin:2px auto 0;font-weight:600;font-size:15px;border:1.5px solid var(--fg);border-radius:999px;padding:9px 16px}
.reelbtn svg{width:13px;height:13px;fill:currentColor}
.vid{display:grid;gap:10px}
.vid video{width:140px;aspect-ratio:9/16;object-fit:cover;background:#000;border-radius:6px}
/* welcome pop-up */
.pop{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px;background:rgba(12,12,12,.45);opacity:0;transition:opacity .25s}
.pop.on{opacity:1}
.pop .card{position:relative;width:min(420px,100%);background:var(--bg);color:var(--fg);border:1.5px solid var(--line);padding:40px 26px 28px;text-align:center;gap:0;transform:translateY(12px);transition:transform .25s}
.pop.on .card{transform:none}
.pop h2{font-family:var(--serif);font-weight:500;font-size:clamp(28px,7.5vw,36px);line-height:1.1;margin:0 0 12px;text-wrap:balance}
.pop p{margin:0 0 22px;color:var(--muted);font-size:16px;text-wrap:balance}
.pop .btn{width:100%}
.pop .x{position:absolute;top:8px;right:8px;width:44px;height:44px;border:0;background:none;color:var(--fg);font-size:28px;line-height:1;cursor:pointer}
.pop .later{display:block;margin:14px auto 0;background:none;border:0;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
/* about */
.about{max-width:640px;margin:0 auto}
.about h1{text-align:left}
.about p{font-size:18px;margin:0 0 22px}
@media(min-width:700px){.about p{font-size:19px;margin-bottom:26px}}

/* contact + reels */
.contact{display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:10px}
.pill{min-width:220px;text-align:center;font-weight:600;font-size:19px;border-radius:999px;padding:17px 34px;border:1.5px solid var(--fg)}
.pill.solid{background:var(--fg);color:var(--bg)}
@media(hover:hover){.pill:hover{opacity:.85}}
.addr{color:var(--muted);font-size:15px;user-select:all;margin-top:-10px}

/* footer */
footer{border-top:1.5px solid var(--line)}
footer .wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:28px calc(36px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){footer .wrap{flex-direction:row;justify-content:space-between}}
.tm{font-family:var(--serif);font-size:24px;letter-spacing:.02em}
.tm sup{font-size:.45em;vertical-align:super}
.social{display:flex;gap:10px}
.social a{display:grid;place-items:center;width:46px;height:46px}
.social svg{width:28px;height:28px;fill:var(--fg)}
@media(hover:hover){.social a:hover svg{fill:var(--muted)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* admin */
.adm{max-width:680px;margin:0 auto}
.adm h1{margin-bottom:8px}
.adm .sub{text-align:center;color:var(--muted);margin:0 0 28px}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--hair)}
.row img,.row .t{width:64px;height:64px;object-fit:cover;background:var(--tile);flex:0 0 64px}
.row .m{flex:1;min-width:0}
.row .n{font-family:var(--serif);font-size:18px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .p{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--hair)}
.chip.available{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.sold{color:var(--muted)}
.chip.hidden{color:var(--muted);border-style:dashed}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button,.ghost{font:inherit;font-size:15px;padding:9px 16px;border-radius:999px;border:1.5px solid var(--hair);background:var(--bg);color:var(--fg);cursor:pointer}
.tabs button[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.add{width:100%;margin-bottom:20px;border:0;cursor:pointer;font-family:var(--sans)}
form.ed{display:grid;gap:16px}
.f{display:grid;gap:6px}
.f>span{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.f input,.f textarea,.f select{font:inherit;font-size:17px;color:var(--fg);background:var(--field);border:1.5px solid var(--hair);border-radius:10px;padding:13px 14px;width:100%}
.f textarea{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--fg);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-size:16px;padding:12px 4px;border:0;background:var(--bg);color:var(--fg);cursor:pointer}
.seg button+button{border-left:1.5px solid var(--fg)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.pic{position:relative;aspect-ratio:1;background:var(--tile)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic .cover{position:absolute;left:4px;bottom:4px;font-size:10px;font-weight:600;letter-spacing:.06em;background:var(--fg);color:var(--bg);padding:2px 6px}
.pic .rm,.pic .mv,.pic .lf{position:absolute;top:4px;width:30px;height:30px;border-radius:50%;border:0;font-size:15px;cursor:pointer;display:grid;place-items:center;padding:0}
.pic .rm{right:4px;background:rgba(0,0,0,.6);color:#fff;font-size:18px}
.pic .mv{left:4px;background:rgba(255,255,255,.88);color:#161616;font-size:13px}
.pic .lf{left:38px;background:rgba(255,255,255,.88);color:#161616}
.upl{display:grid;place-items:center;aspect-ratio:1;border:1.5px dashed var(--muted);color:var(--muted);font-size:14px;text-align:center;cursor:pointer;padding:6px}
.upl input{display:none}
.actions{display:grid;gap:12px;margin-top:8px}
.danger{color:#b3261e;border-color:#b3261e}
.msg{text-align:center;font-size:15px;color:var(--muted);min-height:1.4em}
.adminlink{font-family:var(--sans)!important;font-size:12px!important;letter-spacing:.1em;border:1px solid var(--hair);padding:2px 8px!important;border-radius:999px;align-self:center}
</style>

const CONDS=[["New","c-new"],["Open Box","c-open"],["Like New","c-like"],["Excellent","c-exc"],["Good","c-good"]];
const SPECS=[["designer","Designer"],["dimensions","Dimensions"],["era","Era / Age"],["style","Style"],["materials","Materials"],["provenance","Provenance"]];
const tagsHtml=it=>{const c=CONDS.find(x=>x[0]===it.condition);const t=(c?`<span class="tag ${c[1]}">${esc(c[0])}</span>`:"")+(it.restored?`<span class="tag c-rest">Restored</span>`:"");return t?`<div class="tags">${t}</div>`:""};
const CATS=["Sofas & Sectionals","Lounge & Accent Chairs","Office","Dining Sets","Merch","Misc"];

const norm=(i,n=0)=>({id:i.id,name:i.name||"",price:i.price??null,brand:i.brand||"Unbranded",cat:i.cat||"Misc",desc:i.desc||"",img:Array.isArray(i.img)?i.img.filter(Boolean):[],status:i.status||(i.sold?"sold":"available"),order:i.order??(1e6-n),condition:i.condition||"",restored:!!i.restored,specs:(i.specs&&typeof i.specs==="object")?i.specs:{},video:i.video||""});
const fromRow=r=>norm({id:r.id,name:r.name,price:r.price,brand:r.brand,cat:r.cat,desc:r.description,img:r.img,status:r.status,order:r.sort,condition:r.condition,restored:r.restored,specs:r.specs,video:r.video});
let DATA=[], ready=false, settled=false, canEdit=false, live=false, sb=null;

// Show the last inventory this browser saw while the live copy loads (no flash of stale starter items).
try{const c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");if(c&&c.length){DATA=c.map(fromRow);ready=true}}catch{}

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=p=>p==null||p===""?"Ask for price":"$"+Number(p).toLocaleString();

const state={cat:"All",brand:"All Brands"};

  msgr:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 4.5h15v11h-9l-4.5 4v-4h-1.5z"/></svg>`
};
const setTitle=t=>{document.title=t?`${t} · RECLAIMED NYC`:"RECLAIMED NYC"};

/* ---------- photo strip (cards + product page) ---------- */
const MAX_CARD_PICS=8;
function strip(imgs,alt,eager,w=700){
  return `<div class="strip">${imgs.map((s,n)=>`<img src="${esc(img(s,w))}" data-full="${esc(s)}" onerror="if(this.dataset.full&&this.src!==this.dataset.full)this.src=this.dataset.full" alt="${n?"":esc(alt)}" ${n===0&&eager?`fetchpriority="high"`:`loading="lazy"`} decoding="async" draggable="false">`).join("")}</div>`;
}
// keep dots/counter in sync with the scroll position; calls onChange(index)
function watchStrip(el,onChange){
  let cur=0,raf=0;
  el.addEventListener("scroll",()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const n=Math.round(el.scrollLeft/Math.max(1,el.clientWidth));if(n!==cur){cur=n;onChange(n)}})},{passive:true});
  return {get cur(){return cur},go(n,smooth=true){const c=el.children.length;n=(n+c)%c;el.scrollTo({left:n*el.clientWidth,behavior:smooth&&!reduceMotion?"smooth":"auto"})}};
}

function card(it,sold){
  const imgs=it.img.slice(0,MAX_CARD_PICS), n=imgs.length, href=`#item-${esc(it.id)}`;
  const extras=n>1?`<div class="dots" aria-hidden="true">${imgs.map((_,k)=>`<i${k?"":` class="on"`}></i>`).join("")}</div><button class="arw l" type="button" tabindex="-1" aria-hidden="true">${ICON.l}</button><button class="arw r" type="button" tabindex="-1" aria-hidden="true">${ICON.r}</button>`:"";
  return `<div class="card"><div class="ph"><a href="${href}" tabindex="-1" aria-hidden="true">${n?strip(imgs,it.name,false):`<div class="nophoto">Photo soon</div>`}</a>${extras}</div>
    <a class="t" href="${href}">${sold?"":tagsHtml(it)}<h3>${esc(it.name)}</h3>${sold?`<span class="soldtag">Sold</span>`:`<span class="price">${money(it.price)}</span>`}</a></div>`;
}
function wireCards(root){
  root.querySelectorAll(".ph").forEach(ph=>{
    const s=ph.querySelector(".strip");if(!s||s.children.length<2)return;
    const dots=[...ph.querySelectorAll(".dots i")];
    const w=watchStrip(s,n=>dots.forEach((d,k)=>d.classList.toggle("on",k===n)));
    ph.querySelectorAll(".arw").forEach(b=>b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();w.go(w.cur+(b.classList.contains("r")?1:-1))}));
  });
}
const skeleton=n=>`<div class="grid sk" aria-busy="true" aria-label="Loading">${Array.from({length:n},()=>`<div class="card"><div class="ph"></div><div class="bar"></div><div class="bar"></div></div>`).join("")}</div>`;

/* ---------- pages ---------- */
function shop(){
  setTitle("");
  const head=`<h1>Below-Market<br>Finds, Delivered.</h1>`;
  if(!ready){view.innerHTML=head+skeleton(6);return}
  const avail=sorted(DATA.filter(i=>i.status==="available"));
  const brands=[...new Set(avail.map(i=>i.brand))].sort((a,b)=>a.localeCompare(b));
  if(!brands.includes(state.brand))state.brand="All Brands";
  const list=avail.filter(i=>(state.cat==="All"||i.cat===state.cat)&&(state.brand==="All Brands"||i.brand===state.brand));
  const filtered=state.cat!=="All"||state.brand!=="All Brands";
  view.innerHTML=`${head}
  <div class="filters">
    <label class="select"><span class="sr">Category</span><select id="f-cat">${["All",...CATS].map(c=>`<option value="${esc(c)}"${c===state.cat?" selected":""}>${c==="All"?"All Categories":esc(c)}</option>`).join("")}</select></label>
    <label class="select"><span class="sr">Brand</span><select id="f-brand">${["All Brands",...brands].map(b=>`<option value="${esc(b)}"${b===state.brand?" selected":""}>${esc(b)}</option>`).join("")}</select></label>
  </div>
  ${filtered&&list.length?`<p class="count-line">${list.length} piece${list.length===1?"":"s"}</p>`:""}
  ${list.length?`<div class="grid">${list.map(i=>card(i)).join("")}</div>`:`<p class="empty">Nothing here right now. <a href="${MESSENGER}" target="_blank" rel="noopener">Message us</a> and we'll find it for you.</p>`}`;
  wireCards(view);
  document.getElementById("f-cat").onchange=e=>{state.cat=e.target.value;shop()};
  document.getElementById("f-brand").onchange=e=>{state.brand=e.target.value;shop()};
}
function gallery(){
  setTitle("Gallery");
  const head=`<h1>Gallery</h1><p class="lede">Pieces that already found a new home.</p>`;
  if(!ready){view.innerHTML=head+skeleton(4);return}
  const list=sorted(DATA.filter(i=>i.status==="sold"));
  view.innerHTML=head+(list.length?`<div class="grid">${list.map(i=>card(i,true)).join("")}</div>`:`<p class="empty">Nothing here yet.</p>`);
  wireCards(view);
}
const ICON_MUTE=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>`;
const ICON_SOUND=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>`;
let reelMuted=true;
function reels(startId){
  setTitle("Reels");
  if(!ready){view.innerHTML=`<div class="feed" style="display:grid;place-items:center;color:#999">Loading…</div>`;lockPage();return}
  const list=sorted(DATA.filter(i=>i.video&&i.status!=="hidden"));

}
function lockPage(){document.documentElement.style.overflow="hidden"}
function feed(list,startId){
  lockPage();
  const sold=it=>it.status==="sold";
  view.innerHTML=`<div class="feedbar"><a class="fb" href="#shop" aria-label="Close reels">×</a><span class="ttl">Reels</span><button class="fb" id="mute" type="button" aria-label="Sound on">${reelMuted?ICON_MUTE:ICON_SOUND}</button></div>
  <div class="feed" id="feed">${list.map((it,k)=>`<section class="reel" data-id="${esc(it.id)}" aria-label="${esc(it.name)}">
    <video playsinline loop ${reelMuted?"muted":""} preload="${k<2?"auto":"none"}" ${it.img[0]?`poster="${esc(it.img[0])}"`:""} src="${esc(it.video)}"></video>
    <div class="paused" aria-hidden="true"></div><div class="shade"></div>
    ${k===0&&list.length>1?`<div class="hintup">Swipe up for more</div>`:""}
    <div class="meta">${sold(it)?"":tagsHtml(it)}<h3>${esc(it.name)}</h3><span class="mp">${sold(it)?"Sold":money(it.price)}</span>
      <a class="view" href="#item-${esc(it.id)}">${sold(it)?"See it in the Gallery":"View piece"}</a></div></section>`).join("")}</div>`;
  const fd=document.getElementById("feed"), vids=[...fd.querySelectorAll("video")], mute=document.getElementById("mute");
  const play=v=>{const p=v.play();if(p&&p.catch)p.catch(()=>{v.muted=true;reelMuted=true;mute.innerHTML=ICON_MUTE;v.play().catch(()=>v.closest(".reel").classList.add("is-paused"))})};
  const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector("video"),k=vids.indexOf(v);
    if(e.isIntersecting&&e.intersectionRatio>.6){v.closest(".reel").classList.remove("is-paused");play(v);
      [k+1,k+2].forEach(n=>{if(vids[n]&&vids[n].preload==="none")vids[n].preload="auto"});
      const id=v.closest(".reel").dataset.id;history.replaceState(null,"","#reels-"+id);lastHash="reels-"+id}
    else{v.pause()}}),{root:fd,threshold:[0,.6]});
  fd.querySelectorAll(".reel").forEach(r=>io.observe(r));
  // tap the video to pause / play
  fd.addEventListener("click",e=>{if(e.target.closest("a,button"))return;const r=e.target.closest(".reel");if(!r)return;const v=r.querySelector("video");
    if(v.paused){play(v);r.classList.remove("is-paused")}else{v.pause();r.classList.add("is-paused")}});
  mute.onclick=()=>{reelMuted=!reelMuted;vids.forEach(v=>v.muted=reelMuted);mute.innerHTML=reelMuted?ICON_MUTE:ICON_SOUND;mute.setAttribute("aria-label",reelMuted?"Sound on":"Sound off")};
  fd.addEventListener("scroll",()=>{const h=fd.querySelector(".hintup");if(h&&fd.scrollTop>40)h.style.opacity="0"},{passive:true});
  addEventListener("keydown",function k(e){if(!fd.isConnected)return removeEventListener("keydown",k);
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();fd.scrollBy({top:(e.key==="ArrowDown"?1:-1)*fd.clientHeight,behavior:"smooth"})}
    if(e.key===" "){e.preventDefault();fd.querySelectorAll(".reel").forEach(r=>{const b=r.getBoundingClientRect();if(Math.abs(b.top)<10)r.click()})}
    if(e.key==="Escape")location.hash="shop"});
  const start=Math.max(0,list.findIndex(i=>i.id===startId));
  if(start)fd.scrollTop=start*fd.clientHeight;
}

/* ---------- full-screen viewer: swipe, pinch, pan, tap to zoom, swipe down to close ---------- */
function lightbox(imgs,start,sync){
  const N=imgs.length, opener=document.activeElement;
  let i=start,z=1,tx=0,ty=0,mode=null,sx=0,sy=0,stx=0,sty=0,t0=0,pin=null,closed=false;
  const pts=new Map();
  const lb=document.createElement("div");lb.className="lb"+(N>1?" multi":"");
  lb.setAttribute("role","dialog");lb.setAttribute("aria-modal","true");lb.setAttribute("aria-label","Photo viewer");
  lb.innerHTML=`<div class="stage"><img alt="" draggable="false"></div><button class="lbp l" type="button" aria-label="Previous photo">${ICON.l}</button><button class="lbp r" type="button" aria-label="Next photo">${ICON.r}</button><button class="x" type="button" aria-label="Close">×</button><div class="ct"></div>`;
  document.body.appendChild(lb);
  const prevOverflow=document.documentElement.style.overflow;document.documentElement.style.overflow="hidden";
  const img=lb.querySelector("img"),ct=lb.querySelector(".ct");
  const W=()=>lb.clientWidth,H=()=>lb.clientHeight;
  const bound=()=>{const mx=Math.max(0,(img.offsetWidth*z-W())/2),my=Math.max(0,(img.offsetHeight*z-H())/2);tx=Math.min(mx,Math.max(-mx,tx));ty=Math.min(my,Math.max(-my,ty))};
  const apply=anim=>{img.style.transition=anim&&!reduceMotion?"transform .25s ease, opacity .15s":"opacity .15s";img.style.transform=`translate3d(${tx}px,${ty}px,0) scale(${z})`};
  const hint=()=>{ct.textContent=(N>1?`${i+1} / ${N}`:"")+(z>1?"":(N>1?" · ":"")+"Tap to zoom")};
  const load=()=>{z=1;tx=ty=0;apply(false);img.style.opacity="0";img.onload=()=>{img.style.opacity="1"};img.src=imgs[i];if(img.complete)img.style.opacity="1";
    lb.style.background="";hint();sync&&sync(i);if(N>1)[i+1,i-1].forEach(k=>{new Image().src=imgs[(k+N)%N]})};
  const go=d=>{if(N<2){tx=0;apply(true);return}tx=-d*W();apply(true);setTimeout(()=>{i=(i+d+N)%N;load()},reduceMotion?0:170)};
  const zoomAt=(x,y,k)=>{const cx=W()/2,cy=H()/2;tx=(x-cx)-(x-cx-tx)*(k/z);ty=(y-cy)-(y-cy-ty)*(k/z);z=k;bound()};
  function close(fromHistory){
    if(closed)return;closed=true;lb.remove();document.documentElement.style.overflow=prevOverflow;
    removeEventListener("keydown",key);removeEventListener("popstate",onPop);
    if(!fromHistory)history.back();
    opener&&opener.focus&&opener.focus({preventScroll:true});
  }
  const onPop=()=>close(true);
  const key=e=>{if(e.key==="Escape")close();else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);
    else if(e.key==="Tab"){const f=[...lb.querySelectorAll("button")].filter(b=>b.offsetParent);const a=f.indexOf(document.activeElement);e.preventDefault();f[(a+(e.shiftKey?-1:1)+f.length)%f.length].focus()}};
  // Phone back button closes the viewer instead of leaving the page
  history.pushState({lb:1},"");addEventListener("popstate",onPop);addEventListener("keydown",key);
  lb.querySelector(".x").onclick=()=>close();
  lb.querySelector(".lbp.l").onclick=()=>go(-1);
  lb.querySelector(".lbp.r").onclick=()=>go(1);
  lb.addEventListener("wheel",e=>{e.preventDefault();const k=Math.min(5,Math.max(1,z*(e.deltaY<0?1.15:1/1.15)));zoomAt(e.clientX,e.clientY,k);if(z===1){tx=ty=0}apply(false);hint()},{passive:false});

  lb.addEventListener("pointerdown",e=>{
    if(e.target.closest("button"))return;
    try{lb.setPointerCapture(e.pointerId)}catch{}pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){mode=null;sx=e.clientX;sy=e.clientY;stx=tx;sty=ty;t0=performance.now()}
    else if(pts.size===2){const[a,b]=[...pts.values()];mode="pinch";
      pin={d:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,z,tx,ty}}
  });
  lb.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(mode==="pinch"){if(pts.size<2)return;const[a,b]=[...pts.values()];
      const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2,cx=W()/2,cy=H()/2;
      z=Math.min(5,Math.max(1,pin.z*d/pin.d));
      tx=(mx-cx)-(pin.mx-cx-pin.tx)*(z/pin.z);ty=(my-cy)-(pin.my-cy-pin.ty)*(z/pin.z);bound();apply(false);return}
    if(mode==="done")return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(!mode){if(Math.hypot(dx,dy)<8)return;mode=z>1?"pan":(Math.abs(dx)>Math.abs(dy)?"swipe":"down")}
    if(mode==="pan"){tx=stx+dx;ty=sty+dy;bound();apply(false)}
    else if(mode==="swipe"){tx=N>1?dx:dx*.25;apply(false)}
    else if(mode==="down"){ty=dy>0?dy:dy*.25;lb.style.background=`rgba(12,12,12,${1-Math.min(Math.abs(ty)/500,.6)})`;ct.style.opacity=ty>20?"0":"";apply(false)}
  });
  const up=e=>{
    if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
    if(pts.size){ // one finger lifted mid-pinch: keep panning with the other
      if(mode==="pinch"){const p=[...pts.values()][0];sx=p.x;sy=p.y;stx=tx;sty=ty;mode=z>1?"pan":"done"}return}
    const dx=e.clientX-sx,dy=e.clientY-sy,dt=Math.max(1,performance.now()-t0);
    if(mode==="pinch"||mode==="done"){if(z<1.05){z=1;tx=ty=0}apply(true);hint()}
    else if(!mode&&e.type==="pointerup"){if(z>1){z=1;tx=ty=0}else zoomAt(e.clientX,e.clientY,2.5);apply(true);hint()}
    else if(mode==="swipe"){if(N>1&&(Math.abs(dx)>W()*.18||Math.abs(dx/dt)>.45))go(dx<0?1:-1);else{tx=0;apply(true)}}
    else if(mode==="down"){ct.style.opacity="";if(dy>110||dy/dt>.6)close();else{ty=0;lb.style.background="";apply(true)}}
    else if(mode==="pan"){bound();apply(true)}
    mode=null;
  };
  lb.addEventListener("pointerup",up);lb.addEventListener("pointercancel",up);
  load();lb.querySelector(".x").focus({preventScroll:true});
}

// shrink phone photos before upload (long edge 1800px)
async function shrink(file){
  try{
    const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});
    const k=Math.min(1,1800/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.85));
  }catch{return file}
}

    const msg=t=>document.getElementById("msg").textContent=t;
    view.querySelectorAll(".rm").forEach(b=>b.onclick=()=>{grab();f.img.splice(+b.dataset.n,1);render()});
    view.querySelectorAll(".mv").forEach(b=>b.onclick=()=>{grab();const [u]=f.img.splice(+b.dataset.n,1);f.img.unshift(u);render()});
    view.querySelectorAll(".lf").forEach(b=>b.onclick=()=>{grab();const n=+b.dataset.n;[f.img[n-1],f.img[n]]=[f.img[n],f.img[n-1]];render()});
    view.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{grab();f.status=b.dataset.t;render()});
    const vrm=document.getElementById("v-rm");if(vrm)vrm.onclick=()=>{grab();f.video="";render();msg("Video removed. Tap Save to publish.")};
    document.getElementById("e-video").onchange=async e=>{
      grab();const file=e.target.files[0];if(!file)return;
      if(!sb){msg("Can't reach the inventory service.");return}
      if(file.size>MAX_VIDEO_MB*1048576){msg(`That video is ${(file.size/1048576).toFixed(0)} MB. Keep it under ${MAX_VIDEO_MB} MB (shorter clip, or record at 1080p).`);return}
      msg("Uploading video… keep this page open.");
      try{
        const ext=(file.name.split(".").pop()||"mp4").toLowerCase().replace(/[^a-z0-9]/g,"")||"mp4";
        const path=`videos/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
        const {error}=await sb.storage.from("photos").upload(path,file,{contentType:file.type||"video/mp4",cacheControl:"31536000"});
        if(error)throw error;
        f.video=sb.storage.from("photos").getPublicUrl(path).data.publicUrl;render();msg("Video added. Tap Save to publish it.");
      }catch(err){msg(/size|large|413/i.test(String(err&&(err.message||err.statusCode)))?"Supabase rejected the size. Raise the upload limit in Supabase Storage settings.":"The video didn't upload. Check your connection, or try a shorter clip.")}
    };
    document.getElementById("e-photos").onchange=async e=>{
      grab();const files=[...e.target.files];if(!files.length)return;
      if(!sb){msg("Can't reach the inventory service.");return}
      for(let n=0;n<files.length;n++){
        msg(`Uploading photo ${n+1} of ${files.length}…`);
        try{f.img.push(await uploadPhoto(await shrink(files[n])))}
        catch(err){msg("A photo didn't upload. Check your connection and try again.");render();return}
      }
      render();msg("Photos added. Tap Save to publish them.");
    };
    const del=document.getElementById("del");
    if(del) del.onclick=async()=>{
      if(!confirmDel){grab();confirmDel=true;render();return}
      const {error}=await sb.from("items").delete().eq("id",src.id);
      if(error){msg("Delete failed. Try again.");return}
      await loadItems();location.hash="admin";
    };
    document.getElementById("ed").onsubmit=async e=>{
      e.preventDefault();grab();
      if(!f.name){msg("Add a name first.");return}
      if(!sb){msg("Can't reach the inventory service.");return}
      const docId=isNew?slug(f.name)+"-"+Date.now().toString(36).slice(-4):src.id;
      document.getElementById("save").disabled=true;msg("Saving…");
      const {error}=await sb.from("items").upsert({id:docId,name:f.name,price:f.price,brand:f.brand,cat:f.cat,description:f.desc,img:f.img,status:f.status,sort:f.order,condition:f.condition||null,restored:f.restored,specs:f.specs,...((f.video||(src&&src.video))?{video:f.video||null}:{})});
      if(error){document.getElementById("save").disabled=false;msg("Save failed. Try again in a moment.");return}
      await loadItems();adm.tab=f.status;location.hash="admin";
    };
  };
  render();
}

/* ---------- routing + scroll memory ---------- */
if("scrollRestoration" in history)history.scrollRestoration="manual";
const scrollMem={};
let lastHash=null, prevHash=null;
function route(force){
  let h=location.hash.slice(1)||"shop";
  if(h.startsWith("item-")&&settled){const it=DATA.find(i=>i.id===decodeURIComponent(h.slice(5)));
    if(!it||(it.status==="hidden"&&!canEdit)){history.replaceState(null,"","#shop");h="shop"}}
  // don't wipe an open editor or a playing reel when live data refreshes
  if(force===true&&(h.startsWith("edit-")||(h.startsWith("reels")&&document.getElementById("feed")))&&h===lastHash)return;
  const r=h.startsWith("item-")?"shop":(h.startsWith("edit-")?"admin":(h.startsWith("reels")?"reels":h));
  document.documentElement.style.overflow="";
  document.querySelectorAll("nav a").forEach(a=>{a.dataset.r===r?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current")});
  if(h.startsWith("item-")) item(decodeURIComponent(h.slice(5)));
  else if(h.startsWith("edit-")) editor(h.slice(5));
  else if(h.startsWith("reels")) reels(decodeURIComponent(h.slice(6)));
  else ({reels,gallery,about,contact,admin}[h]||shop)();
  if(h!==lastHash){
    const y=!h.startsWith("item-")&&!h.startsWith("edit-")?scrollMem[h]:0;
    window.scrollTo(0,y||0);
  }else if(force===true&&scrollMem[h]&&window.scrollY===0){window.scrollTo(0,scrollMem[h])}
  if(h!==lastHash){prevHash=lastHash;lastHash=h}
}
addEventListener("hashchange",()=>{if(lastHash)scrollMem[lastHash]=window.scrollY;route()});
addEventListener("pagehide",()=>{if(lastHash)scrollMem[lastHash]=window.scrollY});
route();

/* ---------- live inventory (Supabase) ---------- */
async function uploadPhoto(blob){
  const path=`items/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
  const {error}=await sb.storage.from("photos").upload(path,blob,{contentType:"image/jpeg",cacheControl:"31536000"});
  if(error)throw error;
  return sb.storage.from("photos").getPublicUrl(path).data.publicUrl;
}
const missingItem=()=>{const h=decodeURIComponent(location.hash.slice(1));return h.startsWith("item-")&&!DATA.some(i=>"item-"+i.id===h)};
function useStarter(){settled=true;if(!ready){DATA=ITEMS.map(norm);ready=true;route(true)}else if(missingItem())route(true)}
async function loadItems(){
  if(!sb)return useStarter();
  const before=JSON.stringify(DATA), wasReady=ready;
  const {data,error}=await sb.from("items").select("*");
  if(!error&&data){
    live=true;
    if(data.length){DATA=data.map(fromRow);ready=true;
      try{localStorage.setItem(CACHE_KEY,JSON.stringify(data.filter(r=>r.status!=="hidden")))}catch{}}
    else useStarter();
  }else useStarter();
  settled=true;
  if(!wasReady||JSON.stringify(DATA)!==before||missingItem())route(true);
}
let booted=false;
function boot(){
  if(booted)return;booted=true;
  if(!window.supabase)return useStarter();
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  sb.auth.onAuthStateChange((_e,session)=>{const was=canEdit;canEdit=!!session;if(was!==canEdit)route(true)});
  loadItems();
}
const sbjs=document.getElementById("sbjs");
if(window.supabase)boot();else{sbjs.addEventListener("load",boot);sbjs.addEventListener("error",()=>{booted=true;useStarter()})}
setTimeout(useStarter,6000); // never leave shoppers on a loading screen

function welcome(){
  if(!POPUP.on)return;
  const k="rn_pop_"+POPUP.version;
  try{if(localStorage.getItem(k))return}catch{}
  if(/^#(admin|edit-)/.test(location.hash)||document.querySelector(".lb"))return;
  const el=document.createElement("div");el.className="pop";
  el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-labelledby","pop-t");
  const ext=/^https?:/.test(POPUP.link);
  el.innerHTML=`<div class="card"><button class="x" type="button" aria-label="Close">×</button>
    <h2 id="pop-t">${esc(POPUP.title)}</h2>${POPUP.text?`<p>${esc(POPUP.text)}</p>`:`<div style="height:10px"></div>`}
    ${POPUP.link?`<a class="btn" href="${esc(POPUP.link)}"${ext?` target="_blank" rel="noopener"`:""}>${esc(POPUP.button)}</a>`:`<button class="btn" type="button" style="border:0;cursor:pointer;font-family:var(--sans)">${esc(POPUP.button)}</button>`}
    ${POPUP.link?`<button class="later" type="button">Not now</button>`:""}</div>`;
  const done=()=>{try{localStorage.setItem(k,"1")}catch{}el.classList.remove("on");removeEventListener("keydown",key);setTimeout(()=>el.remove(),250)};
  const key=e=>{if(e.key==="Escape")done()};
  el.addEventListener("click",e=>{if(e.target===el||e.target.closest(".x,.later,button.btn,a.btn"))done()});
  addEventListener("keydown",key);
  document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add("on"));
  const c=el.querySelector(".card");c.tabIndex=-1;c.style.outline="none";c.focus({preventScroll:true});
}
setTimeout(welcome,2000);
</script>
